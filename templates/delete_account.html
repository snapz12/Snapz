<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Delete Account</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000;
color:#fff;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:30px;
font-size:22px;
font-weight:bold;
}

.back{
text-decoration:none;
color:white;
font-size:26px;
}

.warning{
background:#161616;
padding:20px;
border-radius:15px;
border:1px solid #333;
margin-bottom:25px;
line-height:1.6;
}

.warning h2{
color:#ff4d4d;
margin-bottom:12px;
}

.warning p{
color:#ccc;
font-size:15px;
}

input{
width:100%;
height:52px;
background:#111;
border:1px solid #333;
border-radius:12px;
padding:0 15px;
color:white;
font-size:16px;
margin-bottom:20px;
outline:none;
}

.error{
color:#ff4d4d;
margin-bottom:15px;
}

.delete-btn{
width:100%;
height:52px;
border:none;
border-radius:12px;
background:red;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.cancel-btn{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#aaa;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<a href="/account" class="back">←</a>
<span>Delete Account</span>
</div>

<div class="warning">

<h2>Delete your account?</h2>

<p>
This action is permanent.
Your posts, reels, stories, messages,
followers, following, likes and account
will be deleted forever.
</p>

</div>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST">

<input
type="password"
name="password"
placeholder="Enter your password"
required>

<button class="delete-btn">

Delete Account

</button>

</form>

<a href="/account" class="cancel-btn">

Cancel

</a>

</div>

</body>
</html>
