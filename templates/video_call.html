<!DOCTYPE html>
<html>
<head>
    <title>Slovzan Video Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        *{
            box-sizing:border-box;
        }

        html,body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:#000;
            color:#fff;
            font-family:Arial,sans-serif;
        }

        .call-screen{
            position:relative;
            width:100%;
            height:100%;
            background:#000;
        }

        #remoteVideo{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            background:#111;
        }

        #localVideo{
            transform:scaleX(1);
            position:absolute;
            top:18px;
            right:18px;
            width:115px;
            height:165px;
            object-fit:cover;
            background:#222;
            border-radius:16px;
            border:2px solid rgba(255,255,255,.25);
            z-index:5;
            box-shadow:0 5px 20px rgba(0,0,0,.5);
        }

        .top-bar{
            position:absolute;
            top:0;
            left:0;
            right:0;
            z-index:6;
            padding:18px;
            padding-right:150px;
            background:linear-gradient(
                rgba(0,0,0,.65),
                transparent
            );
        }

        .username{
            font-size:18px;
            font-weight:600;
        }

        #callStatus{
            margin-top:4px;
            font-size:13px;
            opacity:.8;
        }

        .controls{
            position:absolute;
            bottom:25px;
            left:50%;
            transform:translateX(-50%);
            z-index:10;
            display:flex;
            align-items:center;
            gap:18px;
            padding:12px 18px;
            border-radius:40px;
            background:rgba(20,20,20,.75);
            backdrop-filter:blur(15px);
        }

        .control{
            width:52px;
            height:52px;
            border:0;
            border-radius:50%;
            background:#333;
            color:#fff;
            font-size:22px;
        }

        .control.active{
            background:#fff;
            color:#000;
        }

        .end{
            width:60px;
            height:60px;
            background:#e53935;
            font-size:25px;
        }

        @media(max-width:480px){
            #localVideo{
                width:100px;
                height:145px;
                top:15px;
                right:15px;
            }

            .controls{
                gap:12px;
                bottom:20px;
            }
        }
    </style>

<style>
.controls .control {
    display: flex;
    align-items: center;
    justify-content: center;
}

.control svg {
    width: 25px;
    height: 25px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.control.end svg {
    transform: rotate(-25deg);
}

.control.off {
    opacity: 0.55;
}
</style>
</head>

<body>

<div class="call-screen">

    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>

    <video
        id="localVideo"
        autoplay
        muted
        playsinline>
    </video>

    <div class="top-bar">
        <div class="username">📹 {{ username }}</div>
        <div id="callStatus">Connecting...</div>
    </div>

    <div class="controls">

        <button
            id="micButton"
            class="control"
            onclick="toggleMic()"
            aria-label="Microphone">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/>
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <path d="M12 18v3"/>
                <path d="M8 21h8"/>
            </svg>

        </button>

        <button
            id="cameraButton"
            class="control"
            onclick="toggleCamera()"
            aria-label="Camera">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 8h4l3 3v2l-3 3h-4Z"/>
                <rect x="2" y="7" width="13" height="10" rx="2"/>
            </svg>

        </button>

        <button
            id="switchCameraButton"
            class="control"
            onclick="switchCamera()"
            aria-label="Switch camera">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7h10l2 3h2"/>
                <path d="M17 4l3 3-3 3"/>
                <path d="M17 17H7l-2-3H3"/>
                <path d="M7 20l-3-3 3-3"/>
            </svg>

        </button>

        <button
            id="endCallButton"
            class="control end"
            onclick="endVideoCall()"
            aria-label="End call">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1.5 1.5 0 0 1 1.6-.35l2.7 1.1a1.5 1.5 0 0 1 .9 1.4v2.1a1.5 1.5 0 0 1-1.6 1.5C10.7 20.3 3.7 13.3 3.4 4.9A1.5 1.5 0 0 1 4.9 3.3H7a1.5 1.5 0 0 1 1.4.9l1.1 2.7a1.5 1.5 0 0 1-.35 1.6Z"/>
            </svg>

        </button>

    </div>

</div>

<script>

const socket = io();

const me = "{{ session['username'] }}";
const otherUser = "{{ chat_with }}";

let pc = null;
let localStream = null;

let remoteDescriptionReady = false;
let pendingCandidates = [];

let currentFacingMode = "user";
let callEnded = false;

let outgoingVideoCall = false;
let incomingVideoCall = false;
let videoCallReady = false;

const configuration = {

    iceServers: [

        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }

    ]
};

const localVideo =
    document.getElementById("localVideo");

const remoteVideo =
    document.getElementById("remoteVideo");

const statusText =
    document.getElementById("callStatus");


function setStatus(text){

    statusText.textContent = text;

}


function createPeerConnection(){

    if(pc){
        return pc;
    }

    pc = new RTCPeerConnection(configuration);

    pc.onicecandidate = function(event){

        if(!event.candidate){
            return;
        }

        socket.emit("ice-candidate",{

            from: me,
            to: otherUser,

            candidate: event.candidate

        });

    };


    pc.ontrack = function(event){

        console.log(
            "REMOTE TRACK:",
            event.track
                ? event.track.kind
                : "unknown"
        );

        if(event.streams && event.streams[0]){

            remoteVideo.srcObject =
                event.streams[0];

        }
        else if(event.track){

            const stream =
                remoteVideo.srcObject ||
                new MediaStream();

            stream.addTrack(
                event.track
            );

            remoteVideo.srcObject =
                stream;

        }

        remoteVideo.play().catch(error=>{

            console.warn(
                "REMOTE VIDEO PLAY WARNING:",
                error
            );

        });

        setStatus("Connected");

    };

    pc.onconnectionstatechange = function(){

        if(!pc){
            return;
        }

        const state =
            pc.connectionState;

        console.log(
            "WEBRTC CONNECTION:",
            state
        );

        if(state === "connected"){

            setStatus("Connected");

        }

        else if(
            state === "connecting"
        ){

            setStatus("Connecting...");

        }

        else if(
            state === "disconnected"
        ){

            setStatus("Reconnecting...");

        }

        else if(
            state === "failed"
        ){

            setStatus("Connection failed");

        }

        else if(
            state === "closed"
        ){

            setStatus("Call ended");

        }

    };


    pc.oniceconnectionstatechange =
        function(){

            console.log(
                "ICE STATE:",
                pc.iceConnectionState
            );

        };


    return pc;

}


async function startLocalMedia(){

    if(localStream){

        localVideo.srcObject = localStream;

        localVideo.muted = true;
        localVideo.playsInline = true;

        localVideo.play().catch(()=>{});

        return localStream;
    }

    try{

        setStatus("Starting camera...");

        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },

                video:{
                    facingMode:{
                        ideal:currentFacingMode
                    },
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    },
                    frameRate:{
                        ideal:30,
                        max:30
                    }
                }

            });

        localVideo.srcObject = localStream;

        localVideo.muted = true;
        localVideo.playsInline = true;

        await localVideo.play().catch(error=>{

            console.warn(
                "LOCAL VIDEO PLAY WARNING:",
                error
            );

        });

        const peer =
            createPeerConnection();

        localStream
            .getTracks()
            .forEach(track=>{

                const exists =
                    peer.getSenders().some(
                        sender =>
                            sender.track &&
                            sender.track.id === track.id
                    );

                if(!exists){

                    peer.addTrack(
                        track,
                        localStream
                    );

                }

            });

        console.log(
            "LOCAL MEDIA READY:",
            localStream.getTracks().map(
                track => track.kind
            )
        );

        setStatus("Camera ready");

        return localStream;

    }
    catch(error){

        console.error(
            "GET USER MEDIA ERROR:",
            error
        );

        setStatus(
            "Camera/microphone permission required"
        );

        throw error;

    }

}

async function flushCandidates(){

    if(!pc){
        return;
    }

    for(
        const candidate of pendingCandidates
    ){

        try{

            await pc.addIceCandidate(
                candidate
            );

        }
        catch(error){

            console.error(
                "ICE QUEUE ERROR:",
                error
            );

        }

    }

    pendingCandidates = [];

}


async function makeOffer(){

    if(callEnded){
        return;
    }

    if(!outgoingVideoCall){
        return;
    }

    if(!videoCallReady){
        return;
    }

    try{

        const peer =
            createPeerConnection();

        setStatus("Calling...");

        const offer =
            await peer.createOffer({

                offerToReceiveAudio:true,
                offerToReceiveVideo:true

            });


        await peer.setLocalDescription(
            offer
        );


        socket.emit("offer",{

            from:me,
            to:otherUser,
            type:"video",

            offer:{
                type:offer.type,
                sdp:offer.sdp
            }

        });

    }
    catch(error){

        console.error(
            "CREATE OFFER ERROR:",
            error
        );

        setStatus("Connection failed");

    }

}



socket.on("video-call-ready", async function(data){

    if(callEnded){
        return;
    }

    if(!outgoingVideoCall){
        return;
    }

    if(
        !data ||
        data.from !== otherUser
    ){
        return;
    }

    if(videoCallReady){
        return;
    }

    videoCallReady = true;

    console.log(
        "RECEIVER FULLSCREEN READY"
    );

    try{

        setStatus("Starting camera...");

        await startLocalMedia();

        await makeOffer();

    }
    catch(error){

        console.error(
            "VIDEO CALL READY ERROR:",
            error
        );

        setStatus("Connection failed");

    }

});

socket.on("offer", async function(data){

    if(callEnded){
        return;
    }

    if(data.from !== otherUser){
        return;
    }

    try{

        await startLocalMedia();

        const peer =
            createPeerConnection();


        await peer.setRemoteDescription(
            new RTCSessionDescription(
                data.offer
            )
        );


        remoteDescriptionReady = true;

        await flushCandidates();


        const answer =
            await peer.createAnswer({

                offerToReceiveAudio:true,
                offerToReceiveVideo:true

            });


        await peer.setLocalDescription(
            answer
        );


        socket.emit("answer",{

            from:me,
            to:otherUser,

            answer:{
                type:answer.type,
                sdp:answer.sdp
            }

        });


        setStatus("Connecting...");

    }
    catch(error){

        console.error(
            "OFFER ERROR:",
            error
        );

        setStatus("Connection failed");

    }

});


socket.on("answer", async function(data){

    if(callEnded){
        return;
    }

    if(data.from !== otherUser){
        return;
    }

    try{

        if(!pc){
            return;
        }

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );


        remoteDescriptionReady = true;

        await flushCandidates();

        setStatus("Connecting...");

    }
    catch(error){

        console.error(
            "ANSWER ERROR:",
            error
        );

    }

});


socket.on("ice-candidate", async function(data){

    if(callEnded){
        return;
    }

    if(data.from !== otherUser){
        return;
    }

    if(!data.candidate){
        return;
    }

    try{

        const candidate =
            new RTCIceCandidate(
                data.candidate
            );


        if(
            pc &&
            pc.remoteDescription
        ){

            await pc.addIceCandidate(
                candidate
            );

        }
        else{

            pendingCandidates.push(
                candidate
            );

        }

    }
    catch(error){

        console.error(
            "ICE ERROR:",
            error
        );

    }

});


socket.on("call-ended", function(data){

    if(
        data &&
        data.from &&
        data.from !== otherUser &&
        data.to !== otherUser
    ){
        return;
    }

    console.log("REMOTE CALL ENDED");

    cleanupCall();

    setStatus("Call ended");

    setTimeout(function(){

        window.location.replace(
            "/chat/" +
            encodeURIComponent(otherUser)
        );

    },400);

});


socket.on("call-rejected", function(data){

    if(
        data &&
        data.from &&
        data.from !== otherUser &&
        data.to !== otherUser
    ){
        return;
    }

    console.log("REMOTE CALL REJECTED");

    cleanupCall();

    setStatus("Call rejected");

    setTimeout(function(){

        window.location.replace(
            "/chat/" +
            encodeURIComponent(otherUser)
        );

    },400);

});


async function initializeCall(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );

        outgoingVideoCall =
            params.get("outgoing") === "1";

        incomingVideoCall =
            params.get("incoming") === "1";


        /*
         * OUTGOING VIDEO CALL
         *
         * Open fullscreen immediately.
         * Start camera/mic immediately so the
         * caller can see their own preview.
         * Wait for receiver to accept before
         * creating the WebRTC offer.
         */

        if(outgoingVideoCall){

            setStatus("Starting camera...");

            await startLocalMedia();

            setStatus("Waiting for receiver...");

            return;
        }


        /*
         * INCOMING VIDEO CALL
         *
         * Accept already happened in chat.html.
         * This fullscreen page now starts camera/mic
         * and tells the caller that we are ready.
         */

        if(incomingVideoCall){

            setStatus("Starting camera...");

            await startLocalMedia();

            videoCallReady = true;

            console.log(
                "INCOMING CAMERA READY"
            );

            setStatus("Connecting...");

            socket.emit("video-call-ready",{
                from:me,
                to:otherUser,
                type:"video"
            });

            return;
        }


        /*
         * FALLBACK
         */

        await startLocalMedia();

        setStatus("Connecting...");

        if(me < otherUser){

            outgoingVideoCall = true;

            videoCallReady = true;

            await makeOffer();

        }

    }
    catch(error){

        console.error(
            "CALL INITIALIZATION ERROR:",
            error
        );

        console.error(
            "MEDIA ERROR NAME:",
            error && error.name
        );

        console.error(
            "MEDIA ERROR MESSAGE:",
            error && error.message
        );

        setStatus("Camera unavailable");

    }

}

function toggleMic(){

    if(callEnded || !localStream) return;

    const tracks = localStream.getAudioTracks();

    if(!tracks.length) return;

    const enabled = tracks[0].enabled;

    tracks.forEach(function(track){
        track.enabled = !enabled;
    });

    const button = document.getElementById("micButton");

    if(!button) return;

    button.classList.toggle("off", enabled);

    button.innerHTML = enabled ? `
        <svg width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v4"></path>
            <path d="M8 22h8"></path>
            <path d="M4 4l16 16"></path>
        </svg>
    ` : `
        <svg width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v4"></path>
            <path d="M8 22h8"></path>
        </svg>
    `;
}


function toggleCamera(){

    if(callEnded || !localStream) return;

    const tracks = localStream.getVideoTracks();

    if(!tracks.length) return;

    const enabled = tracks[0].enabled;

    tracks.forEach(function(track){
        track.enabled = !enabled;
    });

    const button = document.getElementById("cameraButton");

    if(!button) return;

    button.classList.toggle("off", enabled);

    button.innerHTML = enabled ? `
        <svg width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 8h4l3 3v2l-3 3h-4z"></path>
            <rect x="2" y="6" width="13" height="12" rx="2"></rect>
            <path d="M4 4l16 16"></path>
        </svg>
    ` : `
        <svg width="25" height="25" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 8h4l3 3v2l-3 3h-4z"></path>
            <rect x="2" y="6" width="13" height="12" rx="2"></rect>
        </svg>
    `;
}


async function switchCamera(){

    if(callEnded || !localStream) return;

    const oldTrack =
        localStream.getVideoTracks()[0];

    if(!oldTrack) return;

    const oldFacingMode = currentFacingMode;

    currentFacingMode =
        currentFacingMode === "user"
            ? "environment"
            : "user";

    try{

        const newStream =
            await navigator.mediaDevices.getUserMedia({
                audio:false,
                video:{
                    facingMode:{
                        ideal:currentFacingMode
                    }
                }
            });

        const newTrack =
            newStream.getVideoTracks()[0];

        if(!newTrack){
            throw new Error("New camera track unavailable");
        }

        if(pc){

            const sender =
                pc.getSenders().find(function(sender){
                    return sender.track &&
                           sender.track.kind === "video";
                });

            if(sender){
                await sender.replaceTrack(newTrack);
            }
        }

        oldTrack.stop();

        localStream.removeTrack(oldTrack);
        localStream.addTrack(newTrack);

        document.getElementById(
            "localVideo"
        ).srcObject = localStream;

        console.log(
            "Camera switched:",
            currentFacingMode
        );

    }
    catch(error){

        currentFacingMode = oldFacingMode;

        console.error(
            "SWITCH CAMERA ERROR:",
            error
        );
    }
}


function endVideoCall(){

    if(callEnded) return;

    console.log("ENDING VIDEO CALL");

    callEnded = true;

    try{

        socket.emit("end-call",{
            to:otherUser,
            from:me,
            type:"video"
        });

    }
    catch(error){

        console.error(
            "END CALL SOCKET ERROR:",
            error
        );
    }

    cleanupCall();

    const button =
        document.getElementById("endCallButton");

    if(button){
        button.disabled = true;
    }

    setStatus("Call ended");

    setTimeout(function(){

        window.location.replace(
            "/chat/" +
            encodeURIComponent(otherUser)
        );

    },400);
}


function cleanupCall(){

      callEnded = true;


      /* STOP PEER CONNECTION */

      if(pc){

          pc.ontrack = null;
          pc.onicecandidate = null;
          pc.onconnectionstatechange = null;
          pc.oniceconnectionstatechange = null;

          try{
              pc.getSenders().forEach(
                  sender=>{
                      try{
                          if(sender.track){
                              sender.track.stop();
                          }
                      }
                      catch(e){}
                  }
              );
          }
          catch(e){}

          try{
              pc.close();
          }
          catch(e){}

          pc = null;

      }


      /* STOP LOCAL MEDIA */

      if(localStream){

          localStream
          .getTracks()
          .forEach(
              track=>{
                  try{
                      track.stop();
                  }
                  catch(e){}
              }
          );

          localStream = null;

      }


      /* STOP REMOTE MEDIA */

      if(remoteVideo){

          try{
              remoteVideo.pause();
          }
          catch(e){}

          remoteVideo.srcObject = null;

      }


      /* STOP LOCAL PREVIEW */

      if(localVideo){

          try{
              localVideo.pause();
          }
          catch(e){}

          localVideo.srcObject = null;

      }


      /* CLEAR OLD ICE */

      pendingCandidates = [];
      remoteDescriptionReady = false;

  }



/*
 * Join the user's own Socket.IO room.
 * Backend already uses username rooms.
 */

socket.emit("join",{

    username:me

});


initializeCall();

</script>

</body>
</html>
