<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snapz Support Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:500px;
    height:100dvh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#000;
}

.header{
    height:65px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
    border-bottom:1px solid #222;
    background:#000;
    flex-shrink:0;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

.profile{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#0095f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

.info{
    display:flex;
    flex-direction:column;
}

.name{
    font-size:17px;
    font-weight:bold;
}

.status{
    font-size:12px;
    color:#8e8e8e;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.chat{
    display:flex;
    width:100%;
}

.chat.me{
    justify-content:flex-end;
}

.chat.other{
    justify-content:flex-start;
}

.bubble{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    word-break:break-word;
}

.chat.me .bubble{
    background:#0095f6;
    border-bottom-right-radius:5px;
}

.chat.other .bubble{
    background:#1b1b1b;
    border-bottom-left-radius:5px;
}

.sender{
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.message{
    white-space:pre-wrap;
    line-height:1.5;
    font-size:15px;
}

.time{
    margin-top:6px;
    font-size:11px;
    text-align:right;
    color:#d0d0d0;
}

.footer{
    border-top:1px solid #222;
    padding:10px;
    flex-shrink:0;
    background:#000;
}

form{
    display:flex;
    align-items:flex-end;
    gap:10px;
}

textarea{
    flex:1;
    min-height:46px;
    max-height:120px;
    background:#1b1b1b;
    color:#fff;
    border:none;
    outline:none;
    resize:none;
    border-radius:24px;
    padding:12px 15px;
    font-size:15px;
}

button{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#0095f6;
    color:#fff;
    cursor:pointer;
}

button svg{
    width:20px;
    height:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<a href="/admin/support" class="back">←</a>

<div class="profile">
S
</div>

<div class="info">
<div class="name">
{{ message["username"] }}
</div>

<div class="status">
Support Conversation
</div>
</div>

</div>

<div class="chat-area" id="chatArea">

{% for msg in chat %}

<div class="chat {% if msg['sender']=='Snapz Support' %}me{% else %}other{% endif %}">

    <div class="bubble">

        <div class="sender">
            {{ msg["sender"] }}
        </div>

        <div class="message">
            {{ msg["message"] }}
        </div>

<div class="time">

{{ msg["created_at"] }}

{% if msg["sender"] == "Snapz Support" %}
    {% if msg["seen"] == 1 %}
        ✓✓ Seen
    {% else %}
        ✓ Sent
    {% endif %}
{% endif %}

</div>

    </div>

</div>

{% endfor %}

</div>

<div class="footer">

<form method="POST">

<textarea
name="reply"
id="reply"
placeholder="Type your reply..."
required></textarea>

<button type="submit">

<svg
viewBox="0 0 24 24"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<path
d="M22 2L11 13"
stroke="white"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>

<path
d="M22 2L15 22L11 13L2 9L22 2Z"
stroke="white"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round"/>

</svg>

</button>

</form>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const socket = io();

const textarea = document.getElementById("reply");
const chatArea = document.getElementById("chatArea");

function scrollToBottom(){
    if(chatArea){
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

if(textarea){
    textarea.addEventListener("input", function(){
        this.style.height = "46px";
        this.style.height = this.scrollHeight + "px";
    });
}

if("scrollRestoration" in history){
    history.scrollRestoration = "manual";
}

socket.emit("join_support_admin", {
    support_id: {{ message["id"] }}
});

socket.on("support_message", function(data){
    if(
        String(data.support_id) ===
        String({{ message["id"] }})
    ){
        setTimeout(scrollToBottom, 100);
    }
});

window.addEventListener("load", function(){
    scrollToBottom();
    setTimeout(scrollToBottom, 100);
    setTimeout(scrollToBottom, 300);
    setTimeout(scrollToBottom, 600);
});
</script>




</body>
</html>
