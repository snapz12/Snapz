<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blocked Accounts</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:#000;
    color:white;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.header{
    display:flex;
    align-items:center;
    gap:15px;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.back{
    text-decoration:none;
    color:white;
    font-size:28px;
}

.search{
    width:100%;
    height:52px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#1a1a1a;
    color:white;
    padding:0 15px;
    font-size:16px;
    margin-bottom:20px;
}

.user{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-bottom:1px solid #222;
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.left img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}

.name{
    font-size:17px;
    font-weight:bold;
}

.unblock{
    border:none;
    padding:9px 18px;
    border-radius:10px;
    background:#ff3d81;
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
}

.empty{
    text-align:center;
    margin-top:50px;
    color:#888;
    font-size:17px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <a href="/privacy" class="back">←</a>
        <span>Blocked Accounts</span>
    </div>

    <input
        id="blockedSearch"
        class="search"
        placeholder="Search username..."
        oninput="filterBlockedUsers()"
    >

    {% if users %}

    <div id="blockedUsers">

        {% for blocked_user in users %}

        <div
            class="user"
            data-username="{{ blocked_user['username']|lower }}"
        >

            <div class="left">

                <img
                    src="{% if blocked_user['profile_pic'] %}{% if blocked_user['profile_pic'].startswith('http') or blocked_user['profile_pic'].startswith('/') %}{{ blocked_user['profile_pic'] }}{% else %}/static/images/{{ blocked_user['profile_pic'] }}{% endif %}{% else %}/static/images/default.jpg{% endif %}"
                    onerror="this.onerror=null;this.src='/static/images/default.jpg';"
                >

                <div class="name">
                    @{{ blocked_user['username'] }}
                </div>

            </div>

            <a
                class="unblock"
                href="/unblock/{{ blocked_user['username'] }}"
            >
                Unblock
            </a>

        </div>

        {% endfor %}

    </div>

    <div id="noSearchResult" class="empty" style="display:none;">
        No matching accounts
    </div>

    {% else %}

    <div class="empty">
        No blocked accounts
    </div>

    {% endif %}

</div>

<script>
function filterBlockedUsers(){

    const input =
        document.getElementById("blockedSearch");

    if(!input) return;

    const value =
        input.value.trim().toLowerCase();

    const users =
        document.querySelectorAll("#blockedUsers .user");

    let visible = 0;

    users.forEach(function(user){

        const username =
            user.getAttribute("data-username") || "";

        if(username.includes(value)){
            user.style.display = "flex";
            visible++;
        }else{
            user.style.display = "none";
        }

    });

    const noResult =
        document.getElementById("noSearchResult");

    if(noResult){
        noResult.style.display =
            visible === 0 ? "block" : "none";
    }
}
</script>

</body>
</html>
