 <!DOCTYPE html>

<html>

<head>

<title>SLOGAN</title>

<style>



#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999999;
}

#snapzLogo{
    width:280px;
    opacity:0;
    transform:scale(.3);
    animation:logoZoom 1.4s ease forwards;
}

#snapzSlogan{
    position:absolute;
    bottom:10%;
    width:100%;
    text-align:center;

    font-family:sans-serif;
    font-size:30px;
    font-weight:600;
    letter-spacing:1px;

    color:white;

    opacity:1;
}

#snapzSlogan .pink{
    color:#FF3D81;
}

@keyframes logoZoom{

0%{
opacity:0;
transform:scale(.3);
}

70%{
opacity:1;
transform:scale(1.08);
}

100%{
opacity:1;
transform:scale(1);
}

}

@keyframes showText{

from{
opacity:0;
}

to{
opacity:1;
}

}
@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}
</style>

</head>


<body>
<!-- Splash Screen -->
<div id="splash">

    <img src="/static/images/snapz_logo.png" id="snapzLogo">

<div id="snapzSlogan">
    Snap <span class="pink">Your</span> World.
</div>

    <audio id="startupSound" autoplay>
        <source src="/static/sounds/startup.mp3" type="audio/mpeg">
    </audio>

</div>
 
<script>

window.onload=function(){

const sound = document.getElementById("startupSound");

// Settings se saved volume lo
let volume = localStorage.getItem("startup_volume");

if (volume === null) {
    volume = 0.6;   // Default volume
}

sound.volume = parseFloat(volume);

sound.play().catch(()=>{});

    setTimeout(function(){

        document.getElementById("splash").style.opacity="0";
        document.getElementById("splash").style.transition="0.6s";

        setTimeout(function(){

            document.getElementById("splash").remove();

        },600);

    },2200);

}

setTimeout(function () {

    window.location.href="/";

},2200);


</script>


  
</body>
</html>
