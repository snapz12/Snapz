<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Blocked Accounts</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000;
color:white;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.header{
display:flex;
align-items:center;
gap:15px;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.back{
text-decoration:none;
color:white;
font-size:26px;
}

.search{
width:100%;
height:52px;
border:none;
outline:none;
border-radius:15px;
background:#1a1a1a;
color:white;
padding:0 15px;
font-size:16px;
margin-bottom:20px;
}

.user{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 0;
border-bottom:1px solid #222;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.left img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.name{
font-size:17px;
font-weight:bold;
}

.unblock{
border:none;
padding:9px 18px;
border-radius:10px;
background:red;
color:white;
font-weight:bold;
font-size:15px;
}

.empty{
text-align:center;
margin-top:50px;
color:#888;
font-size:17px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<a href="/privacy" class="back">←</a>
<span>Blocked Accounts</span>
</div>

<input
class="search"
placeholder="Search username...">

<div class="user">

<div class="left">

<img src="/static/images/default.jpg">

<div class="name">

shakil_786

</div>

</div>

<button class="unblock">

Unblock

</button>

</div>

<div class="user">

<div class="left">

<img src="/static/images/default.jpg">

<div class="name">

amina__0

</div>

</div>

<button class="unblock">

Unblock

</button>

</div>

<div class="empty">

No more blocked accounts

</div>

</div>

</body>
</html>
