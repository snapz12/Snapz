<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Support Conversation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:500px;
    height:100dvh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#000;
}

.header{
    height:65px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
    border-bottom:1px solid #222;
    background:#000;
    flex-shrink:0;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:30px;
    font-weight:bold;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.chat-area{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:4px;
    -webkit-overflow-scrolling:touch;
}

.chat{
    display:flex;
    width:100%;
    background:transparent;
    padding:0;
    margin-bottom:4px;
}

.chat.me{
    justify-content:flex-end;
}

.chat.other{
    justify-content:flex-start;
}

.bubble{
    display:inline-flex;
    flex-direction:column;
    width:max-content;
    max-width:75%;
    min-width:0;
    padding:7px 11px;
    border-radius:15px;
    word-break:break-word;
    align-self:flex-start;
}


.chat.me .bubble{
    align-self:flex-end;
    background:#0095f6;
    border-bottom-right-radius:4px;
}

.chat.other .bubble{
    align-self:flex-start;
    background:#1b1b1b;
    border-bottom-left-radius:4px;
}

.sender{
    font-size:11px;
    font-weight:bold;
    margin-bottom:3px;
}

.message{
    white-space:pre-wrap;
    line-height:1.3;
    font-size:15px;
}

.time{
    margin-top:3px;
    font-size:10px;
    text-align:right;
    color:#d0d0d0;
}

.footer{
    border-top:1px solid #222;
    padding:10px;
    flex-shrink:0;
    background:#000;
}

form{
    display:flex;
    align-items:flex-end;
    gap:10px;
}

textarea{
    flex:1;
    min-height:46px;
    max-height:120px;
    background:#1b1b1b;
    color:#fff;
    border:none;
    outline:none;
    resize:none;
    border-radius:24px;
    padding:12px 15px;
    font-size:15px;
}

button{
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#0095f6;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<a
href="/my_support"
class="back">

←

</a>

<div class="title">

Support Conversation

</div>

</div>


<div
class="chat-area"
id="chatArea"
>

{% for msg in chat %}

<div class="chat
{% if msg['sender'] == session['username'] %}
me
{% else %}
other
{% endif %}
">

<div class="bubble">

<div class="sender">

{{ msg["sender"] }}

</div>

<div class="message">

{{ msg["message"] }}

</div>

<div class="time">

{{ msg["created_at"] }}

{% if msg["sender"] == session["username"] %}

{% if msg["seen"] == 1 %}

✓✓ Seen

{% else %}

✓ Sent

{% endif %}

{% endif %}

</div>

</div>

</div>

{% endfor %}

</div>


<div class="footer">

<form method="POST">

<textarea
name="message"
id="messageBox"
placeholder="Type your message..."
required
></textarea>

<button type="submit">

➤

</button>

</form>

</div>

</div>


<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const supportId = {{ support["id"] }};

const chatArea = document.getElementById("chatArea");

const messageBox =
document.getElementById("messageBox");


// =================================
// Scroll to bottom
// =================================

function scrollToBottom(){

    if(chatArea){

        chatArea.scrollTop =
        chatArea.scrollHeight;

    }

}


// =================================
// Page open
// =================================

window.addEventListener("load", function(){

    scrollToBottom();

    setTimeout(
        scrollToBottom,
        100
    );

    setTimeout(
        scrollToBottom,
        300
    );

    setTimeout(
        scrollToBottom,
        600
    );

});


// =================================
// Browser scroll restoration
// =================================

if("scrollRestoration" in history){

    history.scrollRestoration =
    "manual";

}


// =================================
// Textarea auto height
// =================================

messageBox.addEventListener(
    "input",
    function(){

        this.style.height = "46px";

        this.style.height =
        this.scrollHeight + "px";

    }
);


// =================================
// Socket.IO
// =================================

const socket = io();

socket.emit(
    "join_support",
    {
        support_id: supportId
    }
);


// =================================
// New message
// =================================

socket.on(
    "support_message",
    function(data){

        if(
            String(data.support_id)
            ===
            String(supportId)
        ){

            loadMessages();

        }

    }
);


// =================================
// Load messages
// =================================

async function loadMessages(){

    try{

        const response =
        await fetch(
            "/support_chat_messages/"
            + supportId
        );

        const messages =
        await response.json();

        renderMessages(messages);

    }

    catch(error){

        console.log(error);

    }

}


// =================================
// Render messages
// =================================

function renderMessages(messages){

    let html = "";

    messages.forEach(
        function(msg){

            const mine =
            msg.sender ===
            "{{ session['username'] }}";

            html += `

            <div class="chat ${
                mine
                ? "me"
                : "other"
            }">

                <div class="bubble">

                    <div class="sender">

                        ${msg.sender}

                    </div>

                    <div class="message">

                        ${msg.message}

                    </div>

                    <div class="time">

                        ${msg.created_at}

                        ${
                            mine
                            ? (
                                msg.seen == 1
                                ? " &nbsp; ✓✓ Seen"
                                : " &nbsp; ✓ Sent"
                            )
                            : ""
                        }

                    </div>

                </div>

            </div>

            `;

        }
    );

    chatArea.innerHTML = html;

    scrollToBottom();

}

</script>

</body>

</html>
