<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>

Account Info

</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:sans-serif;

}

body{

background:#000;

color:white;

}

.container{

max-width:500px;

margin:auto;

padding:20px;

}

.header{

display:flex;

align-items:center;

gap:15px;

font-size:22px;

font-weight:bold;

margin-bottom:25px;

}

.back{

text-decoration:none;

color:white;

font-size:26px;

}

.info{

background:#111;

border-radius:18px;

padding:20px;

}

.item{

margin-bottom:18px;

}

.title{

font-size:13px;

color:#888;

margin-bottom:5px;

}

.value{

font-size:17px;

font-weight:bold;

word-break:break-word;

}

.download-btn{

width:100%;

height:55px;

border:none;

border-radius:15px;

margin-top:25px;

background:red;

color:white;

font-size:18px;

font-weight:bold;

transition:.2s;

}

.download-btn.clicked{

background:orange;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<a href="/account"

class="back">

←

</a>

<span>

Account Info

</span>

</div>

<div class="info">

<div class="item">

<div class="title">

Username

</div>

<div class="value">

{{ user[0] }}

</div>

</div>

<div class="item">

<div class="title">

Name

</div>

<div class="value">

{{ user[1] }}

</div>

</div>

<div class="item">

<div class="title">

Bio

</div>

<div class="value">

{{ user[2] }}

</div>

</div>

<div class="item">

<div class="title">

Email

</div>

<div class="value">

{{ user[3] }}

</div>

</div>

<div class="item">

<div class="title">

Mobile Number

</div>

<div class="value">

{{ user[4] }}

</div>

</div>

<div class="item">

<div class="title">

Profile Photo

</div>

<div class="value">

{{ user[5] }}

</div>

</div>

<a href="/download_account_data">

<button
type="button"
class="download-btn"
onclick="this.classList.add('clicked')">

Download Data

</button>

</a>

</div>

</div>

</body>

</html>
