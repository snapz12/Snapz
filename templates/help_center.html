<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Help Center</title>

<style>

body{

background:#000;

color:white;

font-family:sans-serif;

margin:0;

}

.container{

max-width:500px;

margin:auto;

padding:20px;

}

.my-support{

display:block;

text-align:center;

text-decoration:none;

background:#222;

color:white;

padding:14px;

border-radius:12px;

margin-bottom:20px;

font-weight:bold;

}


.header{

display:flex;

align-items:center;

gap:15px;

font-size:22px;

font-weight:bold;

margin-bottom:25px;

}

.back{

color:white;

text-decoration:none;

font-size:28px;

}

input,
textarea{

width:100%;

background:#111;

color:white;

border:none;

border-radius:12px;

padding:14px;

margin-top:15px;

font-size:16px;

}

textarea{

height:140px;

resize:none;

}

.file{

margin-top:20px;

}

button{

width:100%;

height:52px;

margin-top:25px;

background:#0095F6;

color:white;

border:none;

border-radius:12px;

font-size:17px;

font-weight:bold;

}

.success{

background:#113b20;

padding:15px;

border-radius:12px;

margin-bottom:20px;

color:#66ff99;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<a href="/settings"
class="back">←</a>

<span>Help Center</span>

</div>

{% if success %}

<div class="success">

✅ Your support request has been sent successfully.

</div>

{% endif %}

<form
method="POST"
enctype="multipart/form-data">

<input
type="text"
name="subject"
placeholder="Subject"
required>

<textarea
name="message"
placeholder="Describe your problem..."
required></textarea>

<input
class="file"
type="file"
name="image"
accept="image/*">

<button>

Send Request

</button>

</form>

<a class="my-support" href="/my_support">

My Support Requests

</a>

</div>

</body>
</html>
