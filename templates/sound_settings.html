<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Sound Settings</title>

<style>

body{
background:#000;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.header{
display:flex;
align-items:center;
gap:12px;

padding:18px;

font-size:28px;
font-weight:bold;

border-bottom:1px solid #222;
}

.backArrow{
cursor:pointer;
font-size:40px;
user-select:none;
}

.backArrow:hover{
color:#8A2BE2;
}

.section{
padding:20px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:18px;
}

.switchRow{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.switch{

position:relative;
width:60px;
height:32px;

}

.switch input{
display:none;
}

.slider{

position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;

background:#444;
border-radius:50px;
transition:.3s;

}

.slider:before{

content:"";

position:absolute;
width:26px;
height:26px;

left:3px;
top:3px;

background:white;
border-radius:50%;
transition:.3s;

}

input:checked + .slider{

background:#8A2BE2;

}

input:checked + .slider:before{

transform:translateX(28px);

}

.range{

width:100%;
margin-top:15px;

}

#volumeValue{

margin-top:10px;
font-size:18px;
font-weight:bold;

}

.testBtn{

margin-top:30px;
width:100%;
height:50px;

background:#8A2BE2;
color:white;

border:none;
border-radius:12px;

font-size:18px;
font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

<span onclick="history.back()" class="backArrow">
←
</span>

<span>Sound Settings</span>

</div>

<div class="section">

<div class="title">

Startup Sound

</div>

<div class="switchRow">

<span>Enable Startup Sound</span>

<label class="switch">

<input type="checkbox" id="startupToggle">

<span class="slider"></span>

</label>

</div>

<hr style="border:1px solid #222;">

<h3>Volume</h3>

<input
type="range"
min="0"
max="100"
value="60"
class="range"
id="startupVolume">

<div id="volumeValue">

60%

</div>

<button
class="testBtn"
onclick="testSound()">

▶ Test Startup Sound

</button>

<audio id="startupAudio">

<source
src="/static/sounds/startup.mp3"
type="audio/mpeg">

</audio>

</div>

<script>

const slider=document.getElementById("startupVolume");

const value=document.getElementById("volumeValue");

const toggle=document.getElementById("startupToggle");

const audio=document.getElementById("startupAudio");

slider.value=localStorage.getItem("startup_volume") || 60;

value.innerHTML=slider.value+"%";

toggle.checked=(localStorage.getItem("startup_enabled")!="false");

slider.oninput=function(){

value.innerHTML=this.value+"%";

localStorage.setItem("startup_volume",this.value);

}

toggle.onchange=function(){

localStorage.setItem("startup_enabled",this.checked);

}

function testSound(){

audio.volume=slider.value/100;

audio.currentTime=0;

audio.play();

}

</script>

</body>

</html>
